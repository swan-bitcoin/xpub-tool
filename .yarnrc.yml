nodeLinker: node-modules

enableScripts: false

npmMinimalAgeGate: 4320

# Security patch for six advisories published 2026-10-26 (PSEC-6378). Remove
# once 6.1.10 is older than npmMinimalAgeGate.
npmPreapprovedPackages:
  - "bitcoinjs-lib"

npmScopes:
  swan-bitcoin:
    npmAlwaysAuth: true
    npmAuthToken: "${NODE_AUTH_TOKEN}"
    npmRegistryServer: "https://npm.pkg.github.com"

npmRegistries:
  "https://npm.pkg.github.com":
    npmAlwaysAuth: true
    npmAuthToken: "${NODE_AUTH_TOKEN}"
